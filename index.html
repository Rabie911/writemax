<style>

*{box-sizing:border-box}html,body{height:100%;width:100%;margin:0;overflow:hidden}

@keyframes drift{to{transform:translate(4%,-3%) scale(1.08)}}
/* liquid glass */
button,.glass,.item,textarea,.drop,.stats{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.16);box-shadow:none}

button{font:inherit;font-size:.95rem;color:var(--fg);border-radius:999px;padding:.55em 1.1em;cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:.55em;position:relative;overflow:hidden}
button::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .35s;background:radial-gradient(circle,rgba(255,255,255,.95) 0,rgba(255,255,255,.95) 1px,transparent 1.7px) 0 0/23px 19px,radial-gradient(circle,rgba(110,165,255,.95) 0,rgba(110,165,255,.95) 1.2px,transparent 2px) 7px 9px/31px 27px,radial-gradient(circle,rgba(190,215,255,.9) 0,rgba(190,215,255,.9) .8px,transparent 1.5px) 14px 4px/17px 21px,linear-gradient(110deg,transparent 30%,rgba(110,165,255,.3) 47%,rgba(255,255,255,.25) 50%,transparent 68%) -150% 0/250% 100% no-repeat}
button:hover{border-color:rgba(120,165,255,.75);box-shadow:0 0 16px rgba(70,120,255,.35),inset 0 0 12px rgba(70,120,255,.18)}button:hover::after{opacity:.85;animation:glit 1.8s linear infinite}

.ic{width:1.7em;height:1.7em;flex:none;display:inline-grid;place-items:center;border-radius:50%;background:radial-gradient(circle at 30% 25%,rgba(210,230,255,.65),rgba(60,110,255,.28) 55%,rgba(20,40,160,.4));border:1px solid rgba(150,185,255,.6);box-shadow:inset 0 0 8px rgba(90,140,255,.6),0 0 9px rgba(60,110,255,.3)}
.ic svg{width:1em;height:1em;stroke:url(#g);fill:rgba(120,170,255,.18);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 3px rgba(90,150,255,.85))}
header{height:68px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:0 20px}
.side{display:flex;align-items:center;gap:12px}.side.end{justify-content:flex-end}#prog{color:var(--mut)}

.mut{color:var(--mut)}
.home,.step{width:100%;height:100%;padding:20px 4vw;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;overflow:auto;text-align:center}
.hero{position:relative}
.spec{position:absolute;inset:-70px -110px;z-index:0;background:radial-gradient(closest-side at 25% 48%,rgba(59,108,255,.9),transparent),radial-gradient(closest-side at 62% 40%,rgba(155,92,255,.9),transparent),radial-gradient(closest-side at 88% 62%,rgba(70,180,255,.6),transparent);filter:blur(26px);animation:drift 9s ease-in-out infinite alternate}

/* play */
.pane{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5vw;text-align:center;min-width:0}

.wd{display:inline-block;white-space:nowrap}
.c{transition:color .15s,opacity .15s,filter .15s}
.c.ghost{color:#50535c}.c.hid{color:transparent}
.c.ok{color:var(--ok);opacity:1;filter:none}.c.bad{color:#e28f91;opacity:.85;filter:none}.c.sp.bad{background:rgba(226,143,145,.22);border-radius:4px}
.ar{font-size:1.5rem;color:#a9aec9;margin-top:20px;border-top:1px solid var(--bd);padding-top:24px;min-width:40%;max-width:800px}
.stats{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);border-radius:999px;padding:8px 22px;font-family:system-ui;color:var(--mut);white-space:nowrap}.stats b{color:var(--fg)}
.keyh{position:absolute;bottom:24px;right:24px;font-size:.85rem;color:var(--mut)}
kbd{border:1px solid var(--bd);border-radius:6px;padding:1px 8px;margin:0 4px;background:rgba(255,255,255,.08)}
.center h2{font-size:2.6rem;font-weight:400;margin:0}.center .ar{border:0;margin:10px 0;padding:0;font-size:1.35rem}

.vl{width:1px;height:90px;background:rgba(255,255,255,.2);margin:22px 0}
.sent{font-family:system-ui,sans-serif;font-size:clamp(1.3rem,2.4vw,2rem);color:#a3a8c4;line-height:1.9;max-width:820px}
.box{display:inline-block;min-width:70px;height:1.5em;vertical-align:middle;padding:0 8px;background:rgba(255,255,255,.08);border:1px solid transparent;border-radius:8px;line-height:1.5em}
.page{margin:0 auto;width:100%;max-width:1200px;padding:24px 4vw;overflow:auto;max-height:100%}
.item{display:flex;gap:12px;align-items:center;border-radius:20px;padding:12px 16px;margin:10px 0}
.item .w{font-family:system-ui;font-size:1.2rem;font-weight:600;min-width:120px;direction:ltr;text-align:left}
.item .m{flex:1;color:#b0b5d2}.item small{display:block;color:var(--mut);direction:ltr;text-align:left;font-family:system-ui}
h3{margin:22px 0 6px}
.row{display:flex;gap:12px;margin-top:18px;justify-content:center;flex-wrap:wrap}button.pri{padding:.8em 1.3em;font-size:1rem}

@keyframes flow{to{background-position:300% 0}}

.cta{padding:.45em .45em .45em 1.4em;font-size:1rem;gap:.9em}.cir{width:2.3em;height:2.3em;border-radius:50%;background:#fff;display:grid;place-items:center}

.pvi{border-radius:20px;background:linear-gradient(160deg,#0a1145,#232aa8);padding:26px 12px 22px;text-align:center;font-family:system-ui;font-weight:600;font-size:clamp(1rem,1.7vw,1.5rem);direction:ltr}
.tw{position:relative;display:inline-block}.tw .g{color:#4a5070}.tw .t{position:absolute;left:0;top:0;overflow:hidden;white-space:nowrap;color:var(--ok);width:0;animation:typ 3.6s steps(15) infinite}
.pl{margin:16px auto 0;width:42px;height:42px;border-radius:50%;background:#fff;display:grid;place-items:center}
.lvpage{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;overflow:hidden;text-align:center}.lvpage h2{margin:0;font-size:2rem}
.lvs{position:relative;width:min(1100px,96%);height:min(540px,66vh);perspective:1300px;margin-top:12px}
.cd{position:absolute;right:var(--x);top:var(--y);width:var(--w);height:var(--h);cursor:pointer;animation:fly .9s cubic-bezier(.2,.9,.2,1) backwards var(--dl),float 6s ease-in-out infinite var(--dl)}
.ci{position:absolute;inset:0;border-radius:28px;overflow:hidden;background:linear-gradient(160deg,#07124a,#1b1f88);border:1px solid rgba(150,185,255,.55);box-shadow:inset 0 0 20px rgba(70,120,255,.3),0 0 22px rgba(60,110,255,.3),0 18px 40px rgba(0,0,10,.5);display:flex;flex-direction:column;justify-content:flex-end;padding:22px;text-align:right;transition:transform .25s ease-out,scale .3s,box-shadow .3s;transform:translate3d(calc(var(--mx,0)*var(--d)*70px),calc(var(--my,0)*var(--d)*50px),0) rotate(var(--r)) rotateY(calc(var(--mx,0)*var(--d)*16deg)) rotateX(calc(var(--my,0)*var(--d)*-16deg))}
.ci::before{content:"";position:absolute;inset:-20%;background:radial-gradient(45% 40% at 30% 28%,var(--c1),transparent 70%),radial-gradient(50% 45% at 78% 72%,var(--c2),transparent 70%);filter:blur(12px);animation:cloud 10s ease-in-out infinite alternate}
.ci>*{position:relative}.ci .num{position:absolute;top:8px;right:18px;font-size:5rem;font-weight:800;line-height:1;color:rgba(255,255,255,.85);-webkit-text-stroke:1px rgba(255,255,255,.5)}
.ci h3{margin:0;font-size:1.5rem}.ci span{color:#e2e7ff;font-size:.95rem}
.cd:hover{z-index:5}.cd:hover .ci{scale:1.06;box-shadow:inset 0 0 24px rgba(90,140,255,.45),0 0 34px rgba(70,120,255,.5),0 22px 46px rgba(0,0,10,.55)}
.dc{pointer-events:none;opacity:.75}.dc .ci{filter:blur(1.5px);border-radius:20px;padding:0}
.lvs.out .cd{animation:none;opacity:0;transform:translateY(90px) scale(.85);transition:.5s ease}
.lvs.out .cd.pick{opacity:1;transform:scale(1.35);transition:.55s ease;z-index:9}
@media(max-width:900px){.pv{display:none}.hc{max-width:90%}}

@keyframes glit{to{background-position:23px 19px,38px 36px,31px 25px,150% 0}}
@keyframes tw{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1.2)}}
.bar.glass{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(10px)}
.tabs button.sel{background:#fff;color:#0a1240;border-color:#fff;box-shadow:none}
.nz{overflow:visible}.nz g{fill:none;stroke-linecap:round;stroke-linejoin:round}

.home2{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;text-align:center;padding:20px;background:radial-gradient(55% 45% at 50% 108%,rgba(30,85,255,.55),transparent 70%),radial-gradient(40% 30% at 50% 0%,rgba(90,60,255,.16),transparent 70%);animation:pin .6s cubic-bezier(.2,.8,.2,1);transition:.35s}

<body>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="24" y2="24"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#b3bfff"/></linearGradient></defs></svg>
<header><div class="side"><button id="bh"><span class="ic" data-i="home"></span>الرئيسية</button></div>
<div class="bar glass"><button id="n1"><span class="ic" data-i="target"></span>تدرّب على المحفوظ</button><button id="n3"><span class="ic" data-i="refresh"></span>راجع المحفوظ</button></div>
<div class="side end"><span id="prog"></span><button id="bs"><span class="ic" data-i="star"></span>الكلمات المحفوظة</button></div></header>
<div id="main"></div>
<script>

function segs(t,min,max){const out=[];let buf=[];const push=w=>{const n=Math.ceil(w.length/Math.ceil(w.length/max));for(let i=0;i<w.length;i+=n){const p=w.slice(i,i+n);if(p.length>=min)out.push(p.join(' '))}};

function pickWords(t,n){const m=new Map();for(const s of sentences(t)){const cs=clean(s),tk=cs.split(' ');if(tk.length>25)continue;const sk=new Set(s.replace(/[’‘]/g,"'").split(/\s+/).filter(x=>x.includes("'")).map(x=>x.replace(/[^A-Za-z]/g,'').toLowerCase()));for(const w of tk){const l=w.toLowerCase();if(/^[a-z]{5,}$/.test(l)&&!STOP.has(l)&&!sk.has(l)&&!m.has(l))m.set(l,cs)}}return shuffle([...m]).slice(0,n).map(([w,sent])=>({w,sent}))}

arf, and delivered bread door to door. People remembered that kindness for years, and the little shop became the heart of the whole town.", "The astronaut floated beside the window and stared at the blue planet below. Everything she loved was down there, small and fragile and beautiful. Mission control asked for a status report, and she answered calmly that all systems were working perfectly. Yet her heart felt strangely full, as if the silence itself were speaking. She thought about her family, her old school, and the first time she looked up at the night sky. Then she took a deep breath, smiled, and returned to her work, grateful for the journey.", "A curious fox stood at the edge of a wide, shining river. He wanted to reach the golden field on the other side, but the water looked deep and fast. A wise old turtle suggested that he should follow the stones, one careful step at a time. The fox laughed at first, because he preferred to run and jump. Eventually he listened, moved slowly, and crossed without even wetting his tail. From that day on, he understood that patience is often faster than courage alone.", "Every afternoon, an elderly man sat in the park and played chess against himself. A boy watched him for weeks, too shy to say a word. One day the man looked up and asked whether he would like to play. The boy lost the first game in less than ten minutes, but he was not discouraged. He returned the next day, then the next, and slowly his moves became braver and smarter. After a year, he finally won, and the old man shook his hand with proud, gentle eyes.", "It rained all morning, so the whole city moved beneath colorful umbrellas. Emma waited at the station, listening to the soft rhythm of water on the roof. Her train was late, but she did not mind, because she had a new book and a warm cup of tea. Across the platform, a stranger smiled at her and opened the same novel. They laughed quietly, and neither of them said anything for a while. Sometimes a rainy day function noteWrong(i){const it=st.items[st.idx];if(st.mode==='w'){st.wrong.set(it.w,it);st.iw.add(0)}else{if(st.target[i]===' ')return;const wi=st.target.slice(0,i).split(' ').length-1,w=st.target.split(' ')[wi].toLowerCase();st.iw.add(wi);if(w.length>=3&&!st.wrong.has(w))st.wrong.set(w,{w,sent:st.target})}}
function stats(){const m=(Date.now()-st.t0)/60000;$('#wpm')&&($('#wpm').textContent=st.t0&&m>0?Math.round(st.ok/5/m):0);$('#acc')&&($('#acc').textContent=(st.keys?Math.round(st.ok/st.keys*100):100)+'%')}
function press(k){if(st.pos>=st.target.length)return;if(!st.t0)st.t0=Date.now();const cs=chars(),i=st.pos,el=cs[i],good=k.toLowerCase()===st.target[i].toLowerCase();st.keys++;st.typed.push(k);st.pos++;
 if(good){st.ok++;el.classList.add('ok');sfx.ok(i)}else{sfx.bad();noteWrong(i);el.classList.add('bad');if(st.mode==='w'){el.style.display='inline-block';el.style.width=el.getBoundingClientRect().width+'px';el.textContent=k}}
 stats();setCur();if(st.pos===st.target.length&&st.typed.every((c,j)=>c.toLowerCase()===st.target[j].toLowerCase())){st.locked=true;st.nt+=st.target.split(' ').length;st.nw+=st.iw.size;setTimeout(sfx.done,120);const it=st.items[st.idx];speak(st.mode==='w'?(it.sent||it.w):st.target);setTimeout(()=>{st.idx++;item()},1100)}}
function curPos(){const pane=M.querySelector('.pane');if(!pane)return null;const cs=chars(),el=cs[st.pos];if(!el)return null;const pr=pane.getBoundingClientRect(),r=el.getClientRects()[0];
 if(!r||r.width<1.5){const pv=cs[st.pos-1]||el,q=pv.getBoundingClientRect(),f=parseFloat(getComputedStyle(pv).fontSize)*.3;return{L:q.right-pr.left,W:f,T:q.bottom-pr.top+2}}
 return{L:r.left-pr.left,W:r.width,T:r.bottom-pr.top+2}}
function setCur(snap){const pane=M.querySelector('.pane');if(!pane)return;let c=pane.querySelector('#cur');const fresh=!c;
 if(fresh){c=document.createElement('i');c.id='cur';pane.appendChild(c);st.ro&&st.ro.disconnect();st.ro=new ResizeObserver(()=>setCur(1));[...pane.children].forEach(k=>{if(!k.matches('.stats,.keyh,#cur'))st.ro.observe(k)})}
 const p=curPos();if(!p){c.style.opacity=0;c._p=null;return}
 const o=c._p;c._p=p;clearTimeout(c._t);c.style.opacity=1;
 const put=(l,w,t)=>{c.style.left=l+'px';c.style.width=w+'px';c.style.top=t+'px'};
 if(snap===1||fresh||!o||Math.abs(o.T-p.T)>6){c.style.transition='none';put(p.L,p.W,p.T);return}
 const l=Math.min(o.L,p.L),r=Math.max(o.L+o.W,p.L+p.W);
 c.style.transition='left .08s ease-out,width .08s ease-out,top .08s';put(l,r-l,p.T);
 c._t=setTimeout(()=>{c.style.transition='left .26s cubic-bezier(.22,1.3,.36,1),width .26s cubic-bezier(.22,1.3,.36,1)';put(p.L,p.W,p.T)},80)}
addEventListener('resize',()=>st.view==='play'&&setCur(1));
function hint(one){if(st.locked)return;noteWrong(0);const cs=chars();for(let i=st.pos;i<cs.length;i++)if(cs[i].classList.contains('hid')){cs[i].classList.replace('hid','ghost');if(one)break}}
function toggleAns(){if(st.locked)return;const b=$('#hb2');if(st.shown){chars().forEach((c,i)=>i>=st.pos&&c.classList.replace('ghost','hid'));st.shown=0}else{hint(0);st.shown=1}b&&(b.lastChild.textContent=st.shown?'أخفِ الإجابة':'أظهر الإجابة')}
function back(){if(!st.pos)return;const i=--st.pos,el=chars()[i],was=el.classList.contains('ok');st.typed.pop();if(was)st.ok--;el.classList.remove('ok','bad');el.style.display=el.style.width='';el.textContent=st.target[i];stats();setCur()}
 
 
addEventListener('keydown',e=>{if(st.view!=='play'||st.locked)return;
 if(e.key==='Backspace'){e.preventDefault();back();return}
 if(e.key==='\\'){e.preventDefault();const it=st.items[st.idx];speak(st.mode==='w'?(it.sent||it.w):it.s);return}
 if(e.key==='Tab'&&st.mode==='w'){e.preventDefault();toggleAns();return}
 if(e.key.length!==1||e.ctrlKey||e.metaKey||e.altKey)return;e.preventDefault();press(e.key)});
/* results */
function results(){nav('results');sfx.done();const acc=st.keys?Math.round(st.ok/st.keys*100):100,wpm=st.t0?Math.round(st.ok/5/((Date.now()-st.t0)/60000)):0,ws=[...st.wrong.values()];
 M.innerHTML=`<div class="page"><h2 style="text-align:center">انتهى التدريب 🎉</h2><p style="text-align:center;font-size:1.7rem;margin:12px 0"><b style="color:var(--ok)">✓ ${st.nt-st.nw} صحيحة</b> &nbsp;&nbsp; <b style="color:var(--bad)">✗ ${st.nw} خاطئة</b></p><p style="text-align:center" class="mut">الدقة ${acc}% · السرعة ${wpm} WPM</p><h3>${ws.length?'الكلمات التي أخطأت فيها':'ما أخطأت بأي كلمة! 👏'}</h3><div id="wl"></div><div class="row"><button class="pri" id="again">تدريب جديد</button></div></div>`;
 $('#again').onclick=home;
 ws.forEach(o=>{const d=document.createElement('div');d.className='item';d.innerHTML=`<span class="w">${esc(o.w)}</span><span class="m">…</span><button>${saved[o.w]?'✓ محفوظة':I('star')+'احفظ'}</button>`;$('#wl').appendChild(d);
  const m=d.querySelector('.m'),b=d.querySelector('button');tr(o.w).then(t=>m.textContent=t);
  b.onclick=async()=>{if(saved[o.w])return;saved[o.w]={w:o.w,ar:await tr(o.w),sent:o.sent||'',s:0};DB.set(saved);b.textContent='✓ محفوظة';b.classList.add('on')}})}
/* saved lists */
function savedView(){nav('saved');const all=Object.values(saved),L=all.filter(x=>!x.s),D=all.filter(x=>x.s),T=Object.values(trash);
 M.innerHTML=`<div class="page"><h3>قائمة الحفظ (${L.length}) <button id="t1" ${L.length?'':'disabled'}>${I('target')}اختبرني</button></h3><div id="l1"></div><h3>تمت المراجعة (${D.length}) <button id="t2" ${D.length?'':'disabled'}>${I('target')}اختبرني</button></h3><div id="l2"></div><h3><button id="tb" class="${st.showTrash?'on':''}">${I('trash')}المحذوفات (${T.length})</button></h3><div id="l3"></div></div>`;
 const fill=(id,arr,done)=>arr.forEach(x=>{const d=document.createElement('div');d.className='item';d.innerHTML=`<span class="w">${esc(x.w)}</span><span class="m">${esc(x.ar||'')}${x.sent?`<small>${esc(x.sent)}</small>`:''}</span><button class="mv">${done?I('refresh')+'نسيتها':I('star')+'حفظتها'}</button><button class="rm" title="حذف">✕</button>`;
  d.querySelector('.mv').onclick=()=>{x.s=done?0:1;DB.set(saved);savedView()};
  d.querySelector('.rm').onclick=()=>{trash[x.w]=x;TR.set(trash);delete saved[x.w];DB.set(saved);savedView()};$(id).appendChild(d)});
 fill('#l1',L,0);fill('#l2',D,1);
 if(st.showTrash){if(!T.length)$('#l3').innerHTML='<p class="mut" style="text-align:center">ما فيه كلمات محذوفة.</p>';
  T.forEach(x=>{const d=document.createElement('div');d.className='item';d.innerHTML=`<span class="w">${esc(x.w)}</span><span class="m">${esc(x.ar||'')}${x.sent?`<small>${esc(x.sent)}</small>`:''}</span><button class="rs">${I('refresh')}استرجاع</button>`;
   d.querySelector('.rs').onclick=()=>{if(!saved[x.w]){saved[x.w]=x;DB.set(saved)}delete trash[x.w];TR.set(trash);savedView()};$('#l3').appendChild(d)})}
 $('#tb').onclick=()=>{st.showTrash=!st.showTrash;savedView()};
 const t=a=>()=>{st.test=1;begin('w',shuffle(a).map(x=>({w:x.w,sent:x.sent,ar:x.ar})))};$('#t1').onclick=t(L);$('#t2').onclick=t(D)}
/* luxury cursor */
(()=>{if(!matchMedia('(hover:hover) and (pointer:fine)').matches)return;document.documentElement.classList.add('fc');
 const mkd=c=>{const d=document.createElement('div');d.className='cc '+c;document.body.appendChild(d);return d};
 const cv=document.createElement('canvas');cv.className='cc ct';document.body.appendChild(cv);const g=cv.getContext('2d');
 const aura=mkd('ca'),ring=mkd('cr'),dot=mkd('cd');let W,H;
 const rs=()=>{const r=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*r;cv.height=H*r;g.setTransform(r,0,0,r,0,0)};rs();addEventListener('resize',rs);
 let mx=-200,my=-200,rx=mx,ry=my,ax=mx,ay=my,on=0;const pts=[];
 addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;if(!on){on=1;rx=ax=mx;ry=ay=my;document.body.classList.add('cvis')}
  const t=e.target.closest&&e.target;ring.classList.toggle('hov',!!(t&&t.closest('button,label,.drop,a')));document.body.classList.toggle('ti',!!(t&&t.closest('textarea:not([readonly])')))},{passive:true});
 document.addEventListener('mouseleave',()=>{on=0;document.body.classList.remove('cvis')});
 addEventListener('mousedown',e=>{ring.classList.add('dn');const r=mkd('rp');r.style.left=e.clientX+'px';r.style.top=e.clientY+'px';setTimeout(()=>r.remove(),700)});
 addEventListener('mouseup',()=>ring.classList.remove('dn'));
 (function loop(){rx+=(mx-rx)*.22;ry+=(my-ry)*.22;ax+=(mx-ax)*.08;ay+=(my-ay)*.08;
  dot.style.transform=`translate3d(${mx}px,${my}px,0)`;ring.style.transform=`translate3d(${rx}px,${ry}px,0)`;aura.style.transform=`translate3d(${ax}px,${ay}px,0)`;
  pts.push({x:rx,y:ry});if(pts.length>24)pts.shift();g.clearRect(0,0,W,H);g.lineCap='round';
  if(on)for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i];if(Math.hypot(a.x-b.x,a.y-b.y)<.6)continue;const k=i/pts.length;g.strokeStyle=`rgba(130,170,255,${k*.55})`;g.lineWidth=k*5;g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke()}
  requestAnimationFrame(loop)})();
