<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#04050b">
<meta name="description" content="WriteMax: تدرّب على الكتابة بالإنجليزية من قصصك، مع ترجمة ونطق وقائمة كلمات محفوظة.">
<title>WriteMax</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer></script>
<style>
:root{--bg:#04050b;--fg:#eef0ff;--mut:#9aa0c6;--ok:#7fd39a;--bad:#ef6b6e;--acc:#7c8cff;--bd:rgba(255,255,255,.14);
--fl:"Inter","IBM Plex Sans Arabic","Segoe UI",system-ui,sans-serif;--fd:"Sora","Inter","IBM Plex Sans Arabic",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{height:var(--vh,100%);width:100%;margin:0;overflow:hidden;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--fg);font-family:var(--fl);display:flex;flex-direction:column}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;background:radial-gradient(40% 35% at 20% 25%,rgba(59,108,255,.38),transparent 70%),radial-gradient(38% 35% at 80% 30%,rgba(155,92,255,.34),transparent 70%),radial-gradient(45% 40% at 55% 85%,rgba(40,80,220,.3),transparent 70%);filter:blur(30px);animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(4%,-3%) scale(1.08)}}
:focus-visible{outline:2px solid #fff;outline-offset:3px}
h1{font-family:var(--fd)}

/* ---- liquid glass ---- */
button,.glass,.item,textarea,.drop,.stats,.tile,.chip{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.16);box-shadow:none}
button{font:inherit;font-size:.95rem;color:var(--fg);border-radius:999px;padding:.55em 1.1em;cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:.55em;position:relative;overflow:hidden;touch-action:manipulation}
button::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .35s;background:radial-gradient(circle,rgba(255,255,255,.95) 0,rgba(255,255,255,.95) 1px,transparent 1.7px) 0 0/23px 19px,radial-gradient(circle,rgba(110,165,255,.95) 0,rgba(110,165,255,.95) 1.2px,transparent 2px) 7px 9px/31px 27px,radial-gradient(circle,rgba(190,215,255,.9) 0,rgba(190,215,255,.9) .8px,transparent 1.5px) 14px 4px/17px 21px,linear-gradient(110deg,transparent 30%,rgba(110,165,255,.3) 47%,rgba(255,255,255,.25) 50%,transparent 68%) -150% 0/250% 100% no-repeat}
button:hover{border-color:rgba(120,165,255,.75);box-shadow:0 0 16px rgba(70,120,255,.35),inset 0 0 12px rgba(70,120,255,.18)}
button:hover::after{opacity:.85;animation:glit 1.8s linear infinite}
@keyframes glit{to{background-position:23px 19px,38px 36px,31px 25px,150% 0}}
button.on{border-color:var(--ok);color:var(--ok)}
button:disabled{opacity:.4;pointer-events:none}
.ic{width:1.7em;height:1.7em;flex:none;display:inline-grid;place-items:center;border-radius:50%;background:radial-gradient(circle at 30% 25%,rgba(210,230,255,.65),rgba(60,110,255,.28) 55%,rgba(20,40,160,.4));border:1px solid rgba(150,185,255,.6);box-shadow:inset 0 0 8px rgba(90,140,255,.6),0 0 9px rgba(60,110,255,.3)}
.ic svg{width:1em;height:1em;stroke:url(#g);fill:rgba(120,170,255,.18);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 3px rgba(90,150,255,.85))}
.ib{padding:.5em;width:2.6em;height:2.6em;justify-content:center;border-radius:50%;flex:none}
.mut{color:var(--mut)}

/* ---- header ---- */
header{height:68px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:0 20px}
.side{display:flex;align-items:center;gap:12px}.side.end{justify-content:flex-end}
#prog{color:var(--mut);font-family:var(--fd);font-size:.9rem;direction:ltr}
.bar{display:flex;align-items:center;gap:4px;padding:6px;border-radius:999px}
.bar.glass{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(10px)}
.bar button{border:0;background:none;box-shadow:none}
.bar button:hover{background:rgba(255,255,255,.1)}
header button.act{background:#fff;color:#0a1240;border-color:#fff;box-shadow:0 0 16px rgba(255,255,255,.3)}
header button.act::after{display:none}
header button.act .ic svg{stroke:#1a2a9a;filter:none}
#main{flex:1;min-height:0;width:100%;display:flex}
@keyframes pin{from{opacity:0;transform:translateY(16px) scale(.985)}}
@keyframes float{50%{translate:0 -12px}}
@keyframes tw{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1.2)}}

/* ---- home ---- */
.nz{overflow:visible}.nz g{fill:none;stroke-linecap:round;stroke-linejoin:round}
.nz .gl{stroke:#2a64ff;stroke-width:9;opacity:.6;filter:blur(5px)}.nz .md{stroke:#4f86ff;stroke-width:5;fill:rgba(60,110,255,.12)}.nz .co{stroke:#eaf2ff;stroke-width:2}
.home2{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;text-align:center;padding:20px;background:radial-gradient(55% 45% at 50% 108%,rgba(30,85,255,.55),transparent 70%),radial-gradient(40% 30% at 50% 0%,rgba(90,60,255,.16),transparent 70%);animation:pin .6s cubic-bezier(.2,.8,.2,1);transition:.35s}
.home2.out{opacity:0;transform:scale(1.04)}
.brand{position:absolute;top:10px;left:32px;display:flex;align-items:center;gap:10px;font:700 1.15rem var(--fd);direction:ltr}.brand .nz{width:36px;height:36px}
.home2 h1{margin:0;font-size:clamp(2.4rem,5.6vw,4.8rem);line-height:1.1;font-weight:700;letter-spacing:-.02em;direction:ltr}
.home2 h1 span{background:linear-gradient(90deg,#fff,#9db8ff 60%,#b79bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.home2 p{margin:0;color:#b4bbe3}
.lvls{display:flex;gap:clamp(24px,6vw,90px);justify-content:center;margin-top:10px}
.lvl{position:relative;background:rgba(255,255,255,.035);flex-direction:column;gap:10px;padding:26px 30px 20px;min-width:clamp(150px,17vw,215px);border-radius:30px;overflow:visible;backdrop-filter:blur(6px);transition:border-color .3s,box-shadow .3s,background .3s,transform .35s cubic-bezier(.2,.8,.2,1);animation:pin .7s cubic-bezier(.2,.8,.2,1) backwards}
.lvl:nth-child(2){animation-delay:.1s}.lvl:nth-child(3){animation-delay:.2s}
.lvl::after{display:none}
.lvl:hover{transform:translateY(-6px);border-color:rgba(130,170,255,.75);background:rgba(90,130,255,.08);box-shadow:0 0 26px rgba(70,120,255,.3),inset 0 0 20px rgba(70,120,255,.14)}
.lvl:active{transform:translateY(-2px) scale(.985)}
.lvl .nz{width:clamp(80px,10vw,120px);height:clamp(80px,10vw,120px);transition:.3s;animation:float 5s ease-in-out infinite}
.lvl:hover .nz{transform:scale(1.1) rotate(-3deg)}.lvl:hover .nz .gl{opacity:1}
.lvl b{font-size:1.15rem}.lvl small{color:#a6aedb;font-size:.85rem}
.lvl i{position:absolute;width:5px;height:5px;border-radius:50%;background:#dfeaff;box-shadow:0 0 8px 2px #4f86ff;opacity:0}
.lvl:hover i{animation:tw 1.3s ease-in-out infinite}
.lvl i:nth-of-type(1){left:24%;top:12%}.lvl i:nth-of-type(2){right:18%;top:24%;animation-delay:.3s}.lvl i:nth-of-type(3){left:14%;top:48%;animation-delay:.6s}.lvl i:nth-of-type(4){right:22%;top:58%;animation-delay:.9s}.lvl i:nth-of-type(5){left:46%;top:4%;animation-delay:.45s}
.strip{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:.6em;padding:.4em 1.1em .4em .5em;border-radius:999px;font-size:.9rem;color:#c9ceff}
.chip b{color:#fff;font-family:var(--fd);font-weight:700;margin-inline:.2em}

/* ---- start page ---- */
.step{width:100%;height:100%;padding:20px 4vw;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;overflow:auto;text-align:center;animation:pin .6s cubic-bezier(.2,.8,.2,1)}
.tabs{display:inline-flex;gap:4px;padding:5px;border-radius:999px}
.tabs button{border:0;background:none;box-shadow:none}
.tabs button.sel{background:#fff;color:#0a1240;border-color:#fff}
.tabs button.sel .ic svg{stroke:#1a2a9a;filter:none}
.anote{margin:-10px 0 0;display:flex;align-items:center;gap:.55em;color:#b4bbe3;font-size:.92rem;min-height:1.6em;opacity:0;transform:translateY(-4px);transition:opacity .3s,transform .3s}
.anote.show{opacity:1;transform:none}.anote b{color:#7aa2ff;text-shadow:0 0 10px rgba(90,140,255,.9)}
.src{width:min(920px,100%);flex:1;min-height:170px;max-height:46vh;display:flex}
textarea{width:100%;height:100%;color:var(--fg);border-radius:24px;padding:18px;font-size:1rem;line-height:1.7;resize:none;font-family:var(--fl);outline:none}
textarea:focus-visible{border-color:var(--acc);box-shadow:0 0 0 3px rgba(124,140,255,.25)}
textarea[readonly]{color:#c9ceff}
.drop{width:100%;border-radius:24px;border-style:dashed;align-items:center;justify-content:center;text-align:center;cursor:pointer;line-height:2}
.drop:hover,.drop.h{border-color:var(--acc)}
.opts{display:flex;flex-wrap:wrap;gap:14px 28px;justify-content:center;align-items:center}
.og{display:flex;align-items:center;gap:12px}
.tog{position:relative;display:inline-flex;align-items:center;gap:.7em;cursor:pointer;color:#c9ceff;user-select:none}
.tog input{position:absolute;opacity:0;width:1px;height:1px}
.tog input:focus-visible+.sw{outline:2px solid #fff;outline-offset:3px}
.sw{position:relative;width:46px;height:26px;border-radius:99px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);transition:.25s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.28s cubic-bezier(.3,1.4,.5,1)}
.tog input:checked+.sw{background:linear-gradient(135deg,#4f86ff,#9b5cff);border-color:transparent}
.tog input:checked+.sw::after{left:23px}
.row{display:flex;gap:12px;margin-top:18px;justify-content:center;flex-wrap:wrap}
button.pri{padding:.8em 1.3em;font-size:1rem}
.go{font-size:1.1rem;padding:.8em 2em}
.step .row{margin:0}

/* ---- typing ---- */
.pane{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5vw;text-align:center;min-width:0}
.pbar{position:absolute;top:0;left:0;right:0;height:3px;background:rgba(255,255,255,.07)}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#4f86ff,#9b5cff);border-radius:0 3px 3px 0;transition:width .5s}
.tools{position:absolute;top:14px;right:14px;z-index:3;display:flex;gap:8px}
.tgt{font-family:"Inter",system-ui,sans-serif;font-weight:600;font-size:clamp(1.8rem,4.2vw,4rem);line-height:1.3;max-width:900px}
.wd{display:inline-block;white-space:nowrap}
.c{transition:color .15s,opacity .15s,filter .15s}
.c.ghost{color:#6b7091}.c.hid{color:transparent}
.c.ok{color:var(--ok);opacity:1;filter:none}.c.bad{color:#e28f91;opacity:.9;filter:none}.c.sp.bad{background:rgba(226,143,145,.22);border-radius:4px}
#cur{position:absolute;left:0;top:0;height:3px;width:0;border-radius:3px;background:#fff;box-shadow:0 0 8px rgba(255,255,255,.55);pointer-events:none;z-index:2}
.say{margin:22px 0 0;color:var(--mut);font-size:.95rem}
.ar{font-size:1.5rem;color:#b0b6d3;margin-top:20px;border-top:1px solid var(--bd);padding-top:24px;min-width:40%;max-width:800px;line-height:1.7}
.stats{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);border-radius:999px;padding:8px 22px;font-family:var(--fd);font-size:.9rem;color:var(--mut);white-space:nowrap}.stats b{color:var(--fg)}
.keyh{position:absolute;bottom:24px;right:24px;font-size:.85rem;color:var(--mut)}
kbd{border:1px solid var(--bd);border-radius:6px;padding:1px 8px;margin:0 4px;background:rgba(255,255,255,.08);font-family:var(--fl)}
.center h2{font-size:2.6rem;font-weight:400;margin:0}
.center .ar{border:0;margin:10px 0;padding:0;font-size:1.35rem}
.en{font-family:"Inter",system-ui,sans-serif;font-size:1rem;color:var(--mut);max-width:700px}
.vl{width:1px;height:90px;background:rgba(255,255,255,.2);margin:22px 0}
.sent{font-family:"Inter",system-ui,sans-serif;font-size:clamp(1.3rem,2.4vw,2rem);color:#aeb3cf;line-height:1.9;max-width:820px}
.box{display:inline-block;min-width:70px;height:1.5em;vertical-align:middle;padding:0 8px;background:rgba(255,255,255,.08);border:1px solid transparent;border-radius:8px;line-height:1.5em}

/* ---- results & lists ---- */
.page{margin:0 auto;width:100%;max-width:1000px;padding:24px 4vw;overflow:auto;max-height:100%;animation:pin .6s cubic-bezier(.2,.8,.2,1)}
.page.still{animation:none}
h3{margin:22px 0 6px}
.item{display:flex;gap:12px;align-items:center;border-radius:20px;padding:12px 16px;margin:10px 0}
.item .w{font-family:"Inter",system-ui,sans-serif;font-size:1.2rem;font-weight:600;min-width:120px;direction:ltr;text-align:left}
.item .m{flex:1;color:#b8bdd8}.item small{display:block;color:var(--mut);direction:ltr;text-align:left;font-family:"Inter",system-ui,sans-serif}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0 6px}
.tile{border-radius:22px;padding:18px 10px;text-align:center}
.tile b{display:block;font:700 clamp(1.8rem,5vw,2.8rem)/1.15 var(--fd);direction:ltr}
.tile span{color:var(--mut);font-size:.88rem}
.sum{text-align:center;font-size:1.35rem;margin:14px 0}
.rec{display:flex;align-items:center;justify-content:center;gap:.6em;margin:8px 0;color:#ffd98a}
.bars{display:flex;gap:8px;height:150px;align-items:stretch}
.col{flex:1;display:flex;flex-direction:column;gap:6px;align-items:center;min-width:0;font:600 .78rem var(--fd);color:var(--mut)}
.col .tr{flex:1;width:100%;display:flex;align-items:flex-end}
.col i{width:100%;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,#9b5cff,#4f86ff)}

/* ---- toast, audio popover, mobile keyboard ---- */
#toast{position:fixed;bottom:30px;left:50%;transform:translate(-50%,20px);padding:.8em 1.5em;border-radius:22px;background:rgba(10,14,44,.94);border:1px solid rgba(140,175,255,.4);backdrop-filter:blur(14px);opacity:0;pointer-events:none;transition:.3s;z-index:9;max-width:min(560px,92vw);text-align:center;line-height:1.6}#toast.show{opacity:1;transform:translate(-50%,0)}
#pop{position:fixed;top:74px;left:16px;z-index:60;width:min(320px,calc(100vw - 24px));padding:14px 16px;border-radius:24px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);background:rgba(8,12,38,.86);border:1px solid rgba(140,175,255,.35);box-shadow:0 18px 40px rgba(0,0,10,.6)}
#pop .ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
#pop .pr{display:flex;align-items:center;gap:12px}#pop .pr span{min-width:3.6em;text-align:left;color:var(--mut);font-size:.85rem;font-family:var(--fd)}
#pvs{display:flex;gap:6px;margin-top:14px}#pvs button{flex:1;justify-content:center;padding:.5em .4em;font-size:.85rem}#pvs button.sel{background:#fff;color:#0a1240;border-color:#fff}
input[type=range]{direction:ltr;-webkit-appearance:none;appearance:none;flex:1;height:6px;border-radius:99px;background:linear-gradient(90deg,#4f86ff var(--p,100%),rgba(255,255,255,.16) var(--p,100%));outline:none;border:0;padding:0;margin:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:0;box-shadow:0 0 10px rgba(90,140,255,.8)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:0;box-shadow:0 0 10px rgba(90,140,255,.8)}
#kb{position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;border:0;padding:0;font-size:16px;pointer-events:none}

/* ---- luxury cursor (mouse only) ---- */
.fc,.fc *{cursor:none!important}
.fc textarea:not([readonly]){cursor:text!important}
.cc{position:fixed;left:0;top:0;pointer-events:none;opacity:0;transition:opacity .3s}
.cvis .cc{opacity:1}
.ti .cc{opacity:0}
canvas.ct{z-index:99995;width:100vw;height:100vh}
.ca{width:140px;height:140px;margin:-70px 0 0 -70px;border-radius:50%;background:radial-gradient(circle,rgba(90,140,255,.26),transparent 65%);z-index:99996;mix-blend-mode:screen}
.cr{width:36px;height:36px;margin:-18px 0 0 -18px;border-radius:50%;border:1.5px solid rgba(190,210,255,.75);box-shadow:0 0 14px rgba(90,140,255,.5),inset 0 0 10px rgba(90,140,255,.25);z-index:99998;transition:opacity .3s,width .28s cubic-bezier(.2,.8,.2,1),height .28s cubic-bezier(.2,.8,.2,1),margin .28s cubic-bezier(.2,.8,.2,1),background .25s,border-color .25s}
.cr.hov{width:60px;height:60px;margin:-30px 0 0 -30px;background:rgba(110,150,255,.12);border-color:#fff}
.cr.dn{width:24px;height:24px;margin:-12px 0 0 -12px;background:rgba(160,200,255,.25)}
.cd{width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:#fff;box-shadow:0 0 10px 2px rgba(150,190,255,.9);z-index:99999}
.rp{width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;border:2px solid rgba(160,200,255,.9);z-index:99997;animation:rip .65s ease-out forwards}
@keyframes rip{from{opacity:1}to{transform:scale(9);opacity:0}}

@media(max-width:900px){header{padding:0 8px;gap:6px}.bar button,.side button{font-size:.72rem;padding:.45em .6em}}
@media(max-width:700px){
 header{display:flex;height:auto;min-height:56px;padding:8px 10px;gap:6px;justify-content:space-between}
 header .lb{display:none}
 header button{padding:.5em;width:2.7em;height:2.7em;justify-content:center;border-radius:50%}
 header .side,header .side.end{gap:6px}.bar{padding:3px}
 #pop{top:64px;left:8px}
 .home2{padding:64px 14px 18px;gap:16px;justify-content:flex-start;overflow:auto}
 .brand{left:14px;top:10px}
 .lvls{flex-direction:column;gap:12px;width:100%;margin-top:6px}
 .lvl{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;align-items:center;column-gap:16px;row-gap:2px;width:100%;min-width:0;padding:14px 18px;text-align:right;border-radius:22px}
 .lvl .nz{grid-row:1/3;width:64px;height:64px}.lvl i{display:none}
 .step{padding:14px 12px;gap:14px;justify-content:flex-start}
 .src{max-height:none;min-height:190px}
 .pane{padding:56px 14px 70px}
 .stats{bottom:14px;padding:6px 16px;font-size:.85rem}
 .keyh{display:none}
 .ar{font-size:1.15rem;padding-top:16px}.center h2{font-size:2rem}
 .item{flex-wrap:wrap;padding:10px 12px}.item .w{min-width:0;flex:1}.item .m{order:3;flex-basis:100%}
 .page{padding:14px 12px}
 .tiles{gap:8px}.tile{padding:14px 6px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="24" y2="24"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#b3bfff"/></linearGradient></defs></svg>
<header><div class="side"><button id="bh"><span class="ic" data-i="home"></span><span class="lb">الرئيسية</span></button></div>
<div class="bar glass"><button id="n1" title="تدرّب على المحفوظ"><span class="ic" data-i="target"></span><span class="lb">تدرّب على المحفوظ</span></button><button id="n3" title="راجع المحفوظ"><span class="ic" data-i="refresh"></span><span class="lb">راجع المحفوظ</span></button></div>
<div class="side end"><span id="prog"></span><button id="bv" class="ib" title="صوت الكلام" aria-label="صوت الكلام"><span class="ic" data-i="talk"></span></button><button id="bfx" class="ib" title="المؤثرات الصوتية" aria-label="المؤثرات الصوتية"><span class="ic" data-i="spk"></span></button><button id="bs"><span class="ic" data-i="star"></span><span class="lb">الكلمات المحفوظة</span></button></div></header>
<main id="main"></main>
<script>
const $=s=>document.querySelector(s), M=$('#main');

const STORIES=["The old lighthouse keeper woke before dawn, as he had done for forty years. He climbed the narrow stairs, checked the lamp, and watched the grey sea slowly turn silver. Nobody visited the island anymore, yet he kept the light burning every night, just in case. One stormy evening, a small boat appeared through the fog, and its captain waved a trembling lantern. The keeper smiled, because he finally understood why he had stayed. Some duties matter even when nobody is watching, and a single light can bring a stranger safely home.", "Maya found a tiny key hidden inside a dusty library book. She turned it over in her hands, wondering which door it could possibly open. After searching every corridor, she noticed a small wooden box under the reading desk. Inside was a folded map, drawn carefully in faded blue ink. It led to the garden behind the school, where an ancient oak tree stood quietly. Beneath its roots she discovered a jar full of letters, written by students many years ago. Maya read them all, and then she added a letter of her own.", "A young merchant crossed the desert with three camels and a heavy bag of spices. The days were hot, the nights were cold, and the stars seemed closer than ever. Whenever he felt tired, he remembered the advice of his grandfather: walk slowly, but never stop. After two weeks, he reached a bustling city full of colors, music, and delicious smells. He sold everything before noon, then bought a small notebook to record his journey. That evening, he wrote the first page of a story he would tell for the rest of his life.", "Every morning, the baker opened his shop while the streets were still quiet. The warm smell of fresh bread drifted through the neighborhood and gently woke the sleepy children. He never advertised, because his customers always returned and brought their friends along. One winter, heavy snow blocked the roads, and nobody could reach the shop. So the baker packed his basket, wrapped himself in a thick scarf, and delivered bread door to door. People remembered that kindness for years, and the little shop became the heart of the whole town.", "The astronaut floated beside the window and stared at the blue planet below. Everything she loved was down there, small and fragile and beautiful. Mission control asked for a status report, and she answered calmly that all systems were working perfectly. Yet her heart felt strangely full, as if the silence itself were speaking. She thought about her family, her old school, and the first time she looked up at the night sky. Then she took a deep breath, smiled, and returned to her work, grateful for the journey.", "A curious fox stood at the edge of a wide, shining river. He wanted to reach the golden field on the other side, but the water looked deep and fast. A wise old turtle suggested that he should follow the stones, one careful step at a time. The fox laughed at first, because he preferred to run and jump. Eventually he listened, moved slowly, and crossed without even wetting his tail. From that day on, he understood that patience is often faster than courage alone.", "Every afternoon, an elderly man sat in the park and played chess against himself. A boy watched him for weeks, too shy to say a word. One day the man looked up and asked whether he would like to play. The boy lost the first game in less than ten minutes, but he was not discouraged. He returned the next day, then the next, and slowly his moves became braver and smarter. After a year, he finally won, and the old man shook his hand with proud, gentle eyes.", "It rained all morning, so the whole city moved beneath colorful umbrellas. Emma waited at the station, listening to the soft rhythm of water on the roof. Her train was late, but she did not mind, because she had a new book and a warm cup of tea. Across the platform, a stranger smiled at her and opened the same novel. They laughed quietly, and neither of them said anything for a while. Sometimes a rainy day gives you exactly the small surprise you did not know you needed."];
